[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "beeloft-one"
version = "0.32.0"
description = "Internal production tracking foundation for Beeloft"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "starlette>=0.46,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[tool.setuptools.package-data]
beeloft = ["*.sql", "static/*"]

[tool.setuptools.packages.find]
include = ["beeloft*"]
