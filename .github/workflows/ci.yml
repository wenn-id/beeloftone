name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install application
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Python acceptance tests
        run: python -m unittest discover -s tests -v

      - name: Dependency consistency
        run: python -m pip check

      - name: Byte-compile package
        run: python -m compileall -q beeloft

      - name: JavaScript syntax check
        run: |
          node --check beeloft/static/app.mjs
          node --check beeloft/static/client.mjs

      - name: JavaScript client tests
        run: node tests/test_client.mjs

  browser:
    name: Browser acceptance
    runs-on: ubuntu-latest
    needs: core
    env:
      # Pinned so the acceptance run is reproducible. 1.63.x supports Node.js 22
      # and accepts channel=chromium for the bundled Chromium build.
      PLAYWRIGHT_VERSION: 1.63.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install application
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Browser acceptance suite
        run: |
          python tests/run_browser.py \
            --node node \
            --playwright-module playwright \
            --channel chromium
